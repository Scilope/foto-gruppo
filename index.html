<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album foto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #151412;
    --panel: #1D1B18;
    --line: #38352F;
    --ink: #EDE7DC;
    --ink-dim: #9C9488;
    --amber: #E8871E;
    --rust: #B23A2E;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    padding: 3.5rem 1.5rem 4rem;
  }

  header{
    max-width: 760px;
    margin: 0 auto 3rem;
    text-align: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2rem;
  }

  header h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    letter-spacing: 0.03em;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }

  header h1 span{ color: var(--amber); }

  header p{
    color: var(--ink-dim);
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .grid{
    max-width: 1140px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.6rem;
  }

  .card{
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .card:hover, .card:focus-visible{
    border-color: var(--amber);
    transform: translateY(-3px);
  }

  .card:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .thumb{
    width: 100%;
    aspect-ratio: 4 / 3;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .thumb::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.05) 55%);
  }

  .thumb.placeholder{
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb.placeholder svg{
    width: 30px;
    height: 30px;
    opacity: 0.4;
    position: relative;
    z-index: 1;
  }

  .label{
    position: absolute;
    left: 0.9rem;
    bottom: 0.7rem;
    z-index: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .tag{
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    z-index: 1;
    background: var(--amber);
    color: #151412;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    padding: 0.15rem 0.5rem;
  }

  footer{
    max-width: 760px;
    margin: 3.5rem auto 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.95rem;
    border-top: 1px solid var(--line);
    padding-top: 1.5rem;
  }
</style>
</head>
<body>

<header>
  <h1>Album <span>foto</span></h1>
  <p>Raduni, live e serate del gruppo. Scegli l'evento per aprire l'album su Google Foto.</p>
</header>

<div class="grid">

  <a class="card" href="https://photos.app.goo.gl/XJxsvXuYDuBrpFTE6" target="_blank" rel="noopener">
    <div class="thumb" style="background-image: url('img/raduno.jpg');">
      <span class="label">Raduno di gruppo</span>
    </div>
  </a>

  <a class="card" href="#" target="_blank" rel="noopener">
    <div class="thumb" style="background-image: url('img/live.jpg');">
      <span class="label">Live sul palco</span>
    </div>
  </a>

  <a class="card" href="#" target="_blank" rel="noopener">
    <div class="thumb placeholder" style="background: linear-gradient(135deg,#2A2622,#403A32);">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    </div>
    <span class="label">Backstage</span>
  </a>

  <a class="card" href="#" target="_blank" rel="noopener">
    <div class="thumb placeholder" style="background: linear-gradient(135deg,#2A2622,#403A32);">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    </div>
    <span class="label">Giro in moto</span>
  </a>

  <a class="card" href="#" target="_blank" rel="noopener">
    <div class="thumb placeholder" style="background: linear-gradient(135deg,#2A2622,#403A32);">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    </div>
    <span class="label">Serata rock</span>
  </a>

  <a class="card" href="#" target="_blank" rel="noopener">
    <div class="thumb placeholder" style="background: linear-gradient(135deg,#2A2622,#403A32);">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EDE7DC" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    </div>
    <span class="label">Festa di chiusura</span>
  </a>

</div>

<footer>
  Album aggiornati periodicamente
</footer>

</body>
</html>
